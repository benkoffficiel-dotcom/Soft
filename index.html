<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2D73B9">
<title>Maquette Soft RDC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout : en-tête collant (logo, site, connexion) + barre de rôles ; chaque écran = panneaux de travail en 2 colonnes, une seule sur téléphone */
:root{
  --bg:#EDF2F8; --surface:#FFFFFF; --surface2:#F5F8FC; --ink:#16202D; --muted:#5A6779; --line:#D6DFEA;
  --blue:#2D73B9; --blue-ink:#1D5995; --blue-soft:#E2EDF9; --on-blue:#FFFFFF;
  --red:#CE1223; --red-soft:#FBE5E7; --yellow:#F7D618; --yellow-soft:#FDF5C4; --on-yellow:#1C1C1C;
  --green:#1C8048; --green-soft:#DFF2E6; --amber:#A76300; --amber-soft:#FCEED7;
  --shadow:0 1px 2px rgba(22,32,45,.06),0 4px 14px rgba(22,32,45,.05);
  --logo-bg:#FFFFFF; --navbg:#DCE4EE;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1219; --surface:#141D27; --surface2:#1A2532; --ink:#E4EBF3; --muted:#94A2B4; --line:#283646;
  --blue:#5A9BE0; --blue-ink:#94C0F0; --blue-soft:#182C43; --on-blue:#0C1219;
  --red:#F0525F; --red-soft:#3B1B21; --yellow:#F7D618; --yellow-soft:#3A3413; --on-yellow:#1C1C1C;
  --green:#4CC27E; --green-soft:#16321F; --amber:#E7A23B; --amber-soft:#3A2B14;
  --shadow:0 1px 2px rgba(0,0,0,.3); --navbg:#1F2B39; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1219; --surface:#141D27; --surface2:#1A2532; --ink:#E4EBF3; --muted:#94A2B4; --line:#283646;
  --blue:#5A9BE0; --blue-ink:#94C0F0; --blue-soft:#182C43; --on-blue:#0C1219;
  --red:#F0525F; --red-soft:#3B1B21; --yellow:#F7D618; --yellow-soft:#3A3413; --on-yellow:#1C1C1C;
  --green:#4CC27E; --green-soft:#16321F; --amber:#E7A23B; --amber-soft:#3A2B14;
  --shadow:0 1px 2px rgba(0,0,0,.3); --navbg:#1F2B39; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:.98rem;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.label{font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* En-tête */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-row{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.brand .logo{width:44px;height:44px;border-radius:10px;background:var(--logo-bg);padding:2px;flex:none;border:1px solid var(--line)}
.brand b{display:block;font-size:1.05rem;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:.78rem}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.site-pick{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px}
.site-pick select{border:0;background:transparent;font-weight:700;padding:4px;cursor:pointer}
.chip-net{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px}
.chip-net .dot{width:9px;height:9px;border-radius:50%;background:var(--green)}
.chip-net.off .dot{background:var(--amber)}
.chip-net.off{background:var(--amber-soft);border-color:var(--amber)}
.roles{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0;border-top:1px solid var(--line)}
.roles::-webkit-scrollbar{display:none}
.roles a{flex:none;text-decoration:none;color:var(--muted);font-weight:600;padding:10px 12px 11px;border-bottom:3px solid transparent;display:flex;align-items:center;gap:7px;white-space:nowrap}
.roles a:hover{color:var(--ink)}
.roles a[aria-current="page"]{color:var(--blue-ink);border-bottom-color:var(--blue)}
.badge{background:var(--red);color:#fff;border-radius:999px;font-size:.72rem;font-weight:700;min-width:20px;height:20px;padding:0 6px;display:inline-grid;place-items:center}
.badge.zero{background:var(--line);color:var(--muted)}

/* Mise en page */
main{padding-block:18px 60px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.page-head h1{font-size:1.5rem;font-weight:800;letter-spacing:-.015em}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:16px;align-items:start}
.cols.wide-left{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.cols.wide-right{grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr)}
.stack{display:grid;gap:16px;min-width:0}
@media (max-width:860px){.cols,.cols.wide-left,.cols.wide-right{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.subtabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.subtabs button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;gap:6px;align-items:center}
.subtabs button[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue-ink)}

/* Formulaires */
form{display:grid;gap:14px}
.field{display:grid;gap:5px;min-width:0}
.field>span{font-size:.84rem;font-weight:600}
.field>span em{font-style:normal;color:var(--muted);font-weight:500}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=tel],input[type=date],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{flex:1 1 120px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:600;background:var(--surface2)}
.seg label:has(input:checked){border-color:var(--blue);background:var(--blue-soft);color:var(--blue-ink)}
.seg input{accent-color:var(--blue)}
.boxed{border:1px dashed var(--line);border-radius:10px;padding:14px;display:grid;gap:12px;background:var(--surface2)}
.btn{border:1px solid transparent;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--blue);color:var(--on-blue)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--blue)}
.btn.warn{background:var(--yellow);color:var(--on-yellow)}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{min-height:34px;padding:6px 11px;font-size:.86rem;border-radius:8px}
.btn.block{width:100%}
.linkbtn{background:none;border:0;color:var(--blue-ink);font-weight:600;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}

/* Liste évolutive (combo) */
.combo{position:relative}
.combo-menu{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);max-height:280px;overflow:auto;padding:4px}
.opt{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:7px;cursor:pointer}
.opt:hover,.opt.on{background:var(--blue-soft)}
.opt small{color:var(--muted)}
.opt.add{color:var(--blue-ink);font-weight:700;border-top:1px solid var(--line);border-radius:0 0 7px 7px}
.opt.empty{color:var(--muted);cursor:default}
.evo-tag{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;color:var(--blue-ink);background:var(--blue-soft);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:1px}

/* File d'attente */
.queue{display:grid;gap:8px}
.q{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.q.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
.q .tk{font-family:var(--mono);font-weight:600;font-size:.95rem;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:52px;text-align:center}
.q .who{min-width:0}
.q .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q .who span{font-size:.84rem;color:var(--muted)}
.q-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:520px){.q{grid-template-columns:auto minmax(0,1fr)}.q-actions{grid-column:1/-1;justify-content:flex-start}}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-infirmier{background:var(--amber-soft);color:var(--amber)}
.st-medecin{background:var(--blue-soft);color:var(--blue-ink)}
.st-caisse{background:var(--yellow-soft);color:var(--ink)}
.st-caisse::before{background:var(--yellow);box-shadow:0 0 0 1px var(--amber)}
.st-remise{background:var(--red-soft);color:var(--red)}
.st-termine{background:var(--green-soft);color:var(--green)}
.empty-state{border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted)}

/* Fiche */
.fiche-head{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.fiche-head h2{font-size:1.3rem}
.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.vital{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.vital span{display:block;font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.vital b{font-family:var(--mono);font-size:1.02rem}
.vital b small{font-family:var(--font);font-weight:500;color:var(--muted);font-size:.78rem}
.vital.alert{border-color:var(--red);background:var(--red-soft)}
.timeline{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl{position:relative;padding:0 0 14px 16px}
.tl::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--blue)}
.tl b{display:block}
.presc-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.3fr) 76px 40px;gap:8px;align-items:start}
@media (max-width:640px){.presc-row{grid-template-columns:minmax(0,1fr) 76px 40px}.presc-row .poso{grid-column:1/-1;grid-row:2}}
.icon-btn{width:40px;height:44px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);cursor:pointer;font-size:1.1rem;color:var(--muted)}
.icon-btn:hover{color:var(--red);border-color:var(--red)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 11px;font-size:.84rem;font-weight:600;cursor:pointer}
.quick button:hover{border-color:var(--blue);color:var(--blue-ink)}

/* Tableaux */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tfoot td{font-weight:800;border-bottom:0;font-size:1rem}
.price-in{width:96px !important;min-height:36px !important;padding:6px 8px !important;text-align:right}
.price-in.missing{border-color:var(--red);background:var(--red-soft)}

/* Indicateurs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font-size:1.7rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px}
.kpi small{color:var(--muted);font-size:.82rem}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .val{fill:var(--ink);font-weight:700}
.chart .bar{fill:var(--blue-soft);stroke:var(--blue);stroke-width:1}
.chart .bar.today{fill:var(--blue);stroke:var(--blue)}
.chart .grid{stroke:var(--line);stroke-width:1}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 40px;gap:4px 10px;align-items:center;font-size:.9rem}
.hbar .track{grid-column:1/-1;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:6px}
.hbar .fill{height:100%;background:var(--red);border-radius:99px}

/* Sites (Dr Soft) */
.sites{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:16px}
.site{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.site-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.site h3{font-size:1.15rem}
.site .mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.site .mini div{background:var(--surface2);border-radius:8px;padding:8px 10px}
.site .mini b{display:block;font-size:1.2rem;font-variant-numeric:tabular-nums}
.ab-actif{background:var(--green-soft);color:var(--green)}
.ab-bientot{background:var(--yellow-soft);color:var(--ink)}
.ab-bientot::before{background:var(--amber)}
.ab-attente,.ab-expire{background:var(--red-soft);color:var(--red)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:.88rem;font-weight:600}
.switch input{width:38px;height:22px;appearance:none;background:var(--line);border-radius:99px;position:relative;cursor:pointer;transition:background .15s;flex:none}
.switch input::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch input:checked{background:var(--green)}
.switch input:checked::after{left:19px}

/* Patient */
.rdv{background:var(--blue);color:var(--on-blue);border-radius:16px;padding:22px;display:grid;gap:6px;position:relative;overflow:hidden}
.rdv::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:18px solid var(--yellow);opacity:.9}
.rdv .label{color:inherit;opacity:.85}
.rdv strong{font-size:1.6rem;line-height:1.15;max-width:18ch;font-weight:800;position:relative;z-index:1}
.rdv .count{display:inline-flex;background:var(--yellow);color:var(--on-yellow);font-weight:800;border-radius:999px;padding:4px 12px;width:max-content;margin-top:6px}

/* Listes évolutives */
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.84rem}
.chips span.new{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-ink);font-weight:600}

/* Modale & reçu */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,16,24,.55);display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
.modal-card{background:var(--surface);border-radius:16px;max-width:430px;width:100%;padding:18px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.receipt{background:#FFFFFF;color:#1C1C1C;font-family:var(--mono);font-size:12.5px;line-height:1.5;padding:18px 16px;border-radius:4px;border:1px solid var(--line);max-width:320px;width:100%;margin:0 auto;position:relative}
.receipt .c{text-align:center}
.receipt img{width:64px;height:64px;display:block;margin:0 auto 4px}
.receipt hr{border:0;border-top:1px dashed #9AA3AD;margin:8px 0}
.receipt .l{display:flex;justify-content:space-between;gap:10px}
.receipt .big{font-size:30px;font-weight:600;text-align:center;letter-spacing:.04em}
.receipt .tot{font-size:14px;font-weight:600}
.stamp{display:block;width:max-content;margin:10px auto;padding:4px 16px;border:3px solid;border-radius:8px;font-size:22px;font-weight:800;letter-spacing:.12em;transform:rotate(-6deg)}
.stamp.ok{color:#1F7A3A;border-color:#1F7A3A}.stamp.no{color:#C8102E;border-color:#C8102E}
.pill.unpaid{background:var(--red-soft);color:var(--red)}
.pill.paid{background:var(--green-soft);color:var(--green)}
.payl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.wa{background:var(--green-soft);border:1px solid var(--green);border-radius:12px;padding:12px;font-size:.88rem;white-space:pre-line}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap}
.modal-actions .btn{flex:1 1 140px}

/* Site public */
.site-nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.site-nav a{color:var(--muted);text-decoration:none;font-weight:600;padding:8px 10px;border-radius:8px}
.site-nav a:hover{color:var(--ink);background:var(--surface2)}
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:28px;align-items:center;padding-block:28px 20px}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(2rem,4.5vw,3.1rem);font-weight:800;letter-spacing:-.025em;line-height:1.05}
.hero h1 em{font-style:normal;color:var(--red)}
.hero p{font-size:1.08rem;color:var(--muted);max-width:52ch}
.hero-art{max-width:320px;width:100%;height:auto;justify-self:center}
.svc-list{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.svc-list .svc{display:flex;gap:12px;align-items:flex-start}
.svc-list .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue-ink);font-weight:800;font-size:.9rem}
.devise{text-align:center;font-style:italic;color:var(--muted);margin:18px auto 0;max-width:640px}
.contact-l{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.contact-l span{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:600}
.urgence{display:flex;gap:14px;align-items:center;background:var(--red);color:#fff;border-radius:14px;padding:14px 18px;font-weight:600;flex-wrap:wrap}
.urgence b{font-size:1.05rem}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}

function itemName(x){return typeof x==='string'?x:x.nom}
function listItems(list){
  if(list==='patients')return S.patients.filter(p=>p.site===UI.site).sort((a,b)=>famKey(a).localeCompare(famKey(b))).map(p=>({n:p.nom,h:`${p.dossier} · ${ageTxt(p)}`}));

function inList(list,val){return S.listes[list].some(x=>norm(itemName(x))===norm(val))}
function addToList(list,val,silent){
  val=val.trim();if(!val||inList(list,val))return false;
  const L=S.listes[list];
  if(list==='motifs')L.push({nom:val,tarif:null});else if(list==='medicaments')L.push({nom:val,prix:null});else L.push(val);
  (S.ajouts[list]=S.ajouts[list]||[]).push(val);save();
  toast(`« ${esc(val)} » est ajouté à la liste <b>${LISTNAMES[list]}</b>. Elle compte maintenant ${L.length} éléments et le proposera la prochaine fois.`,'evo');
  return true;
}

function openMenu(inp){
  const box=inp.closest('.combo'),list=box.dataset.list,menu=box.querySelector('.combo-menu');
  const raw=inp.value.trim(),q=norm(raw),all=listItems(list);
  const f=all.filter(x=>norm(x.n).includes(q)).slice(0,8);
  const exact=all.some(x=>norm(x.n)===q);
  let h=f.map((x,i)=>`<button type="button" class="opt${i===0&&q?' on':''}" data-pick="${esc(x.n)}"><span>${esc(x.n)}</span><small>${esc(x.h)}</small></button>`).join('');
  if(q&&!exact)h+=`<button type="button" class="opt add" data-addval="${esc(raw)}">＋ Ajouter « ${esc(raw)} »${list==='patients'?' comme nouveau patient':' à la liste'}</button>`;
  if(!h)h=`<div class="opt empty">Tapez pour chercher. Si rien ne correspond, vous pourrez l’ajouter.</div>`;
  menu.innerHTML=h;menu.hidden=false;
}
function closeMenus(except){$$('.combo-menu').forEach(m=>{if(m!==except)m.hidden=true})}
function pickVal(inp,val){inp.value=val;inp.closest('.combo').querySelector('.combo-menu').hidden=true;inp.dispatchEvent(new Event('change',{bubbles:true}))}
document.addEventListener('focusin',e=>{if(e.target.matches('.combo input'))openMenu(e.target)});
document.addEventListener('input',e=>{if(e.target.matches('.combo input'))openMenu(e.target)});
document.addEventListener('focusout',e=>{if(e.target.matches('.combo input'))setTimeout(()=>{const m=e.target.closest('.combo')?.querySelector('.combo-menu');if(m&&document.activeElement!==e.target)m.hidden=true},120)});
document.addEventListener('mousedown',e=>{if(e.target.closest('.combo-menu'))e.preventDefault()});
document.addEventListener('keydown',e=>{
  if(e.target.matches('.combo input')){
    const menu=e.target.closest('.combo').querySelector('.combo-menu');
    if(e.key==='Escape'){menu.hidden=true}
    if(e.key==='Enter'&&!menu.hidden){const first=menu.querySelector('.opt.on')||menu.querySelector('.opt.add');if(first){e.preventDefault();first.click()}}
  }
});
function comboClick(e){
  const pick=e.target.closest('[data-pick]'),add=e.target.closest('[data-addval]');
  if(!pick&&!add)return false;
  const inp=e.target.closest('.combo').querySelector('input'),list=e.target.closest('.combo').dataset.list;
  if(pick){pickVal(inp,pick.dataset.pick);return true}
  const val=add.dataset.addval;
  if(list==='patients'){UI.newPatient=true;render();setTimeout(()=>{const n=splitName(val);if($('#np-prenom')){$('#np-prenom').value=n.prenom;$('#np-nomf').value=n.nomFam;$('#np-postnom').value=n.postnom}},0);return true}
  addToList(list,val);pickVal(inp,val);return true;
}

function vCaisseMeds(list){
  const v=list.find(x=>x.id===UI.cashOpen)||list[0];if(v)UI.cashOpen=v.id;
  const left=`<section class="panel"><div class="panel-h"><h2>Patients envoyés par le médecin</h2></div><div class="queue">${list.length?list.map(x=>queueRow(x,{sel:x.id===UI.cashOpen,html:`<button class="btn sm ${x.id===UI.cashOpen?'primary':'ghost'}" data-act="cashOpen" data-id="${x.id}">Ouvrir</button>`})).join(''):'<div class="empty-state">Aucun patient n’attend la caisse. Ils apparaissent ici dès que le médecin valide une ordonnance.</div>'}</div></section>`;
  if(!v)return `<div class="cols">${left}<section class="panel"><div class="empty-state">Rien à encaisser.</div></section></div>`;
  const p=P(v.patientId);
  const rows=v.prescription.map((x,i)=>{const pr=medPrix(x.med);return `<tr><td>${esc(x.med)}<div class="small muted">${esc(x.poso)}</div></td><td class="r num">${x.qte}</td><td class="r"><input class="price-in num ${pr==null?'missing':''}" type="number" min="0" step="0.5" data-i="${i}" data-q="${x.qte}" value="${pr??''}" placeholder="prix" aria-label="Prix unitaire de ${esc(x.med)}"></td><td class="r num" id="lt${i}">${pr==null?'—':usd(pr*x.qte)}</td></tr>`}).join('');
  const hasMissing=v.prescription.some(x=>medPrix(x.med)==null);

function cashTotal(){let t=0;$$('.price-in').forEach(i=>{const v=+i.value||0;const l=v*(+i.dataset.q);t+=l;$('#lt'+i.dataset.i).textContent=i.value===''?'—':usd(l);i.classList.toggle('missing',i.value==='')});if($('#cashTot')){$('#cashTot').textContent=usd(t);$('#cashCdf').textContent='soit '+cdf(t)+' (taux fictif 1 $ = '+RATE.toLocaleString('fr-FR')+' FC)'}return t}

/* ---------- Entrée par QR code ---------- */
function qrSVG(seed){
  const n=25,r=rng(seed),cells=[];const fin=(x,y)=>{for(let i=0;i<7;i++)for(let j=0;j<7;j++){const e=i===0||i===6||j===0||j===6||(i>=2&&i<=4&&j>=2&&j<=4);cells[(y+j)*n+x+i]=e?1:0}};
  for(let i=0;i<n*n;i++)cells[i]=r()<.5?1:0;
  for(let i=0;i<8;i++)for(let j=0;j<8;j++){cells[j*n+i]=0;cells[j*n+n-1-i]=0;cells[(n-1-j)*n+i]=0}
  fin(0,0);fin(n-7,0);fin(0,n-7);
  let d='';cells.forEach((c,i)=>{if(c)d+=`M${i%n} ${Math.floor(i/n)}h1v1h-1z`});
  return `<svg viewBox="-2 -2 ${n+4} ${n+4}" width="100%" style="max-width:220px;display:block;margin:0 auto;background:#FFFFFF;border-radius:8px" role="img" aria-label="QR code du site"><path d="${d}" fill="#1C1C1C"/></svg>`;
}

}

  return{patients:vs.length,consult:vs.filter(v=>v.motif!=='Contrôle').length,controle:vs.filter(v=>v.motif==='Contrôle').length,recettes:cash+mm,cash,mm};
}
function barChart(data,fmt=x=>x){
  const W=440,H=180,top=22,bot=30,max=Math.max(...data.map(d=>d.v),1),bw=W/data.length;
  const nice=Math.ceil(max/5)*5||5;
  const y=v=>top+(H-top-bot)*(1-v/nice);
  let g='';[0,.5,1].forEach(t=>{const yy=y(nice*t);g+=`<line class="grid" x1="0" x2="${W}" y1="${yy}" y2="${yy}"/>`});
  const bars=data.map((d,i)=>{const x=i*bw+bw*.2,w=bw*.6,yy=y(d.v);return `<rect class="bar ${d.today?'today':''}" x="${x}" y="${yy}" width="${w}" height="${Math.max(0,H-bot-yy)}" rx="4"/><text class="val" x="${x+w/2}" y="${yy-6}" text-anchor="middle">${fmt(d.v)}</text><text x="${x+w/2}" y="${H-10}" text-anchor="middle">${d.l}</text>`}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}${bars}</svg>`;
}

function aboState(s){
  if(s.statut==='attente')return{k:'attente',t:'En attente du 1er paiement'};
  const d=diffDays(s.echeance,TODAY);
  if(d<0)return{k:'expire',t:'Expiré'};
  if(d<=5)return{k:'bientot',t:`Expire dans ${d} jour${d>1?'s':''}`};
  return{k:'actif',t:'Actif'};
}

function payLine(v){
  const it=[];
  if(v.tarif>0)it.push(`<span class="small">${esc(v.motif)} ${usd(v.tarif)}</span><span class="pill ${v.payeConsult?'paid':'unpaid'}">${v.payeConsult?'Payé':'Non payé'}</span><button type="button" class="linkbtn small" data-act="pRcpt" data-id="${v.id}" data-k="ticket">Voir le reçu</button>`);
  if(v.prescription.length&&['caisse','remise','termine'].includes(v.statut)){const m=v.prescription.reduce((a,x)=>a+(medPrix(x.med)||0)*x.qte,0);it.push(`<span class="small">Médicaments ${usd(m)}</span><span class="pill ${v.payeMed?'paid':'unpaid'}">${v.payeMed?'Payé':'Non payé'}</span><button type="button" class="linkbtn small" data-act="pRcpt" data-id="${v.id}" data-k="recu">Voir le reçu</button>`)}
  return it.map(x=>`<div class="payl">${x}</div>`).join('');
}
function receipt(v,kind,who){
  const p=P(v.patientId),s=siteOf(v.site);
  const pay=kind==='ticket'?v.payeConsult:v.payeMed;
  const lines=kind==='ticket'?(v.tarif>0?[[v.motif,v.tarif]]:[]):v.prescription.map(x=>[x.med+' × '+x.qte,(medPrix(x.med)||0)*x.qte]);
  const tot=lines.reduce((a,l)=>a+l[1],0);
  const no=(kind==='ticket'?'T':'R')+'-'+s.id.toUpperCase()+'-'+v.date.replace(/-/g,'').slice(2)+'-'+pad(v.ticket);
  const html=`<div class="receipt" id="rcpt"><img src="${LOGO}" alt=""><div class="c"><b>PROJET SOFT RDC</b><br>Toxicologie médicale &amp; médecine spéciale<br>Site de ${esc(s.nom)}</div><hr>
  <div class="l"><span>${kind==='ticket'?'TICKET DE PASSAGE':'REÇU'}</span><span>${no}</span></div><div class="l"><span>${fmtShort(v.date)}</span><span>${v.heure||nowHM()}</span></div><div>Patient : ${esc(p.nom)}</div><div>Dossier : ${p.dossier}</div><hr>
  ${kind==='ticket'?`<div class="c">Votre numéro</div><div class="big">${pad(v.ticket)}</div><div class="c">${esc(v.motif)}${v.date===TODAY&&v.statut==='infirmier'?' · '+todayQ(v.site).filter(x=>x.statut==='infirmier'&&x.ticket<v.ticket).length+' personne(s) avant vous':''}</div><hr>`:''}
  ${lines.map(l=>`<div class="l"><span>${esc(l[0])}</span><span>${usd(l[1])}</span></div>`).join('')}
  ${lines.length?`<hr><div class="l tot"><span>TOTAL</span><span>${usd(tot)}</span></div><div class="l"><span></span><span>${cdf(tot)}</span></div>${pay?`<span class="stamp ok">PAYÉ</span><div>Mode : ${pay.mode==='mm'?'Mobile money · '+esc(pay.op)+' · réf. '+esc(pay.ref||'—'):'Cash'}</div>`:`<span class="stamp no">NON PAYÉ</span><div class="c">Reste à payer à la caisse : ${usd(tot)}</div>`}<hr>`:kind==='ticket'?'<div class="c">Contrôle : pas de frais</div><hr>':''}
  ${kind!=='ticket'&&v.controle?`<div class="c">Prochain contrôle :<br><b>${fmtLong(v.controle)}</b></div><hr>`:''}
  <div class="c">Merci de votre confiance</div></div>`;
  const wa=`Bonjour ${p.nom.split(' ')[0]}, voici votre ${kind==='ticket'?'ticket de passage N° '+pad(v.ticket):'reçu '+no} du Centre Soft RDC (${s.nom}).${lines.length?(pay?'\nPAYÉ : '+usd(tot)+'.':'\nNON PAYÉ : '+usd(tot)+' à régler à la caisse.'):''}${kind!=='ticket'&&v.controle?'\nProchain contrôle : '+fmtLong(v.controle)+'.':''}`;
  openModal(`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>${kind==='ticket'?'Ticket de passage':pay?'Reçu de paiement':'Médicaments à payer'}</h2><button class="icon-btn" data-act="close" aria-label="Fermer">×</button></div>${html}
  ${who==='patient'?`<div class="modal-actions"><button class="btn primary" data-act="close">Fermer</button></div>`:`<div class="modal-actions"><button class="btn primary" data-act="pos">Imprimer sur le PoS</button><button class="btn ghost" data-act="wa" data-tel="${esc(p.tel)}">Envoyer par WhatsApp</button></div>`}
  <div class="wa" id="waPrev" hidden><b>Message WhatsApp au ${esc(p.tel)}</b>\n${esc(wa)}\n📎 ${kind==='ticket'?'ticket':'reçu'}.pdf</div>`);
}

  payConsultOk(b){const v=S.visites.find(x=>x.id===b.dataset.id);const pay=readPay('pc');v.payeConsult={...pay,montant:v.tarif};S.paiements.push({date:TODAY,site:v.site,montant:v.tarif,mode:pay.mode,objet:'Consultation',visiteId:v.id});save();track();closeModal();render();receipt(v,'ticket')},
  pos(){toast('Simulation : le reçu part vers l’imprimante PoS Bluetooth (58 mm).')},
  wa(b){$('#waPrev').hidden=false;toast(`Simulation : envoyé sur WhatsApp au ${esc(b.dataset.tel)}.`)},
  voirSite(b){UI.site=b.dataset.id;UI.dirSub='tableau';saveUI();location.hash='direction'},
  payAbo(b){const s=siteOf(b.dataset.id);const base=s.echeance&&s.echeance>TODAY?s.echeance:TODAY;s.echeance=addDays(base,30);s.statut='actif';save();render();toast(`Paiement mobile money de ${usd(ABO)} reçu pour ${esc(s.nom)}. Site actif jusqu’au ${fmtShort(s.echeance)}.`)},
  auto(b){const s=siteOf(b.dataset.id);s.auto=b.checked;save();render();toast(s.auto?`Renouvellement automatique activé pour ${esc(s.nom)}.`:`Renouvellement automatique désactivé pour ${esc(s.nom)}.`)}
};
document.addEventListener('click',e=>{
  if(e.target.closest('.combo-menu')){comboClick(e);return}
  if(e.target.id==='modal'){closeModal();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  if(b.matches('input[type=radio]')&&e.type==='click'){ACT[b.dataset.act](b);return}
  if(b.matches('input[type=checkbox]')){ACT[b.dataset.act](b);return}
  ACT[b.dataset.act]&&ACT[b.dataset.act](b,e);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='sitePick2'){UI.site=t.value;saveUI();render()}
  if(t.id==='sitePick'){UI.site=t.value;UI.nurseOpen=UI.docOpen=UI.cashOpen=null;saveUI();render()}
  if(t.id==='patPick'){UI.patientId=t.value;saveUI();render()}
  if(t.id==='a-motif'){const m=S.listes.motifs.find(x=>norm(x.nom)===norm(t.value));if(m){$('#a-tarif').value=m.tarif??'';if(m.tarif==null)$('#a-tarif').focus()}syncTarif()}
  if(t.id==='d-ctrl'&&t.value)$('#d-ctrl-txt').textContent=fmtLong(t.value);
});

/* ---------- Formulaires ---------- */
const FORM={
  profilPat(){const p=P(UI.session.id);p.naissance=$('#pp-n').value||p.naissance;p.sexe=$('#pp-s').value||p.sexe;p.tel=$('#pp-t').value.trim()||p.tel;p.email=$('#pp-e').value.trim()||p.email;save();closeModal();render();toast('Profil mis à jour.')},
  news(){const t=$('#nw-t').value.trim(),x=$('#nw-x').value.trim();if(!t||!x){toast('Écrivez un titre et un message.');return}
    const canaux=$$('input[name="nw-c"]:checked').map(i=>i.value);if(!canaux.length){toast('Choisissez au moins un canal.');return}
    const se=agentOf(UI.session?.id);const site=se&&se.role==='drsoft'?($('#nw-site')?.value||null):UI.site;
    const ps=S.patients.filter(p=>!site||p.site===site);const nMail=ps.filter(p=>p.email).length;
    const envoyes=ps.length*37+11;(S.news=S.news||[]).push({id:uid('n'),site,date:TODAY,titre:t,texte:x,canaux,envoyes});save();track();render();
    toast(`Simulation : nouvelle envoyée à ${envoyes} patients${canaux.includes('mail')?' (dont '+(nMail*37)+' par e-mail)':''}. Elle apparaît aussi dans leur espace.`)},
  pmail(){const m=$('#pm-mail').value.trim();if(!m.includes('@')||!m.includes('.')){toast('Cette adresse e-mail ne semble pas valide.');return}
    const p=P(UI.session.id);p.email=m;save();render();toast('E-mail enregistré. Vous recevrez aussi les rappels par e-mail.')},
  loginAgent(){const l=norm($('#la-login').value),m=$('#la-mdp').value;const a=(S.agents||[]).find(x=>norm(x.login)===l);
    if(!a||a.mdp!==m){toast('Identifiant ou mot de passe incorrect.');return}
    if(!a.actif){toast('Ce compte est désactivé. Contactez la direction.');return}
    UI.session={type:'agent',id:a.id};if(a.site)UI.site=a.site;saveUI();
    if(a.provisoire){UI.homeView='profil';location.hash='home';render();return}
    UI.homeView='home';location.hash=ROLE_HOME[a.role];render();toast(`Bonjour ${esc(a.prenom)}.`)},
  loginPatient(){const raw=$('#lp-id').value.trim(),w=norm(raw).replace(/\s/g,''),dg=raw.replace(/\D/g,'');
    const p=S.patients.find(x=>norm(x.dossier)===w||(dg.length>=6&&(x.tel||'').replace(/\D/g,'').endsWith(dg.slice(-6))));
    if(!p){toast('Numéro introuvable. Vérifiez votre ticket ou inscrivez-vous.');return}
    if(!UI.patCode){UI.patCode=true;render();$('#lp-id').value=raw;$('#lp-code')?.focus();toast(`Code envoyé par SMS au ${esc(p.tel||'numéro enregistré')} (démo : 1234).`);return}
    if($('#lp-code').value.trim()!=='1234'){toast('Code incorrect.');return}
    UI.session={type:'patient',id:p.id};UI.patCode=false;saveUI();location.hash='menu';render()},
  profil(){const a=agentOf(UI.session.id),nn=readName('pf'),m1=$('#pf-m1').value,m2=$('#pf-m2').value;
    if(!nn.prenom||!nn.nomFam){toast('Le prénom et le nom sont nécessaires.');return}
    if(m1.length<6){toast('Choisissez un mot de passe d’au moins 6 caractères.');return}
    if(m1!==m2){toast('Les deux mots de passe ne sont pas identiques.');return}
    Object.assign(a,nn,{tel:$('#pf-tel').value.trim()||a.tel,mdp:m1,provisoire:false});save();UI.homeView='home';location.hash=ROLE_HOME[a.role];render();toast('Profil enregistré. Bon travail !')},
  agent(){const nn=readName('ag');if(!nn.prenom||!nn.nomFam){toast('Le prénom et le nom sont nécessaires.');return}
    const role=$('#ag-role').value,site=$('#ag-site').value;let login=norm(nn.prenom).replace(/[^a-z]/g,'')+'.'+norm(nn.nomFam).replace(/[^a-z]/g,'');let base=login,k=2;while((S.agents||[]).some(x=>x.login===login))login=base+(k++);
    const a={id:uid('a'),...nn,role,site,login,mdp:'Soft-'+String(Math.floor(1000+Math.random()*9000)),provisoire:true,actif:true,tel:$('#ag-tel').value.trim()||null,cree:TODAY};
    (S.agents=S.agents||[]).push(a);save();track();render();showCreds(a,'Compte agent créé')},
  qrRdv(){const w=norm($('#qr-who').value).replace(/\s/g,'');if(!w){toast('Écrivez votre numéro patient.');return}
    const motif=readMotif('qrr');if(!motif){toast('Précisez le motif.');return}
    const p=S.patients.find(x=>norm(x.dossier)===w||norm(x.dossier).endsWith('-'+w.padStart(4,'0')));
    if(!p){UI.qrDone={t:'Numéro introuvable',m:'Vérifiez le numéro sur votre ticket, ou présentez-vous à la caisse.'};render();return}
    if(p.site!==UI.site){UI.qrDone={t:'Autre centre',m:`Ce numéro appartient au centre de ${esc(siteOf(p.site).nom)}. Présentez-vous à la caisse.`};render();return}
    if(S.signalements.some(x=>x.patientId===p.id)||todayQ().some(v=>v.patientId===p.id)){UI.qrDone={t:'Déjà signalé',m:'Votre présence est déjà connue de l’accueil. Asseyez-vous, on appellera votre nom.'};render();return}
    S.signalements.push({id:uid('sg'),site:UI.site,type:motif==='Contrôle'?'rdv':'nouveau',patientId:p.id,nom:p.nom,motif,heure:nowHM()});save();track();
    UI.qrDone={t:'Merci '+esc(p.nom.split(' ')[0])+' !',m:'Votre présence est signalée. Asseyez-vous, l’accueil va la valider et l’infirmier appellera votre nom.'};render()},
  qrNew(){const nn=readName('qr'),nom=nn.nom;if(!nn.prenom||!nn.nomFam){toast('Écrivez au moins votre prénom et votre nom.');return}
    const motif=readMotif('qrn');if(!motif){toast('Précisez le motif de votre visite.');return}
    const tel=$('#qr-tel').value.trim(),m=S.listes.motifs.find(x=>x.nom===motif);
    const ex=tel&&S.patients.find(x=>x.site===UI.site&&(x.tel||'').replace(/\D/g,'').endsWith(tel.replace(/\D/g,'').slice(-6)));
    S.signalements.push({id:uid('sg'),site:UI.site,type:'nouveau',patientId:ex?ex.id:null,nom,prenom:nn.prenom,nomFam:nn.nomFam,postnom:nn.postnom,naissance:$('#qr-naiss').value||null,tel,motif,plainte:$('#qr-plainte').value,heure:nowHM()});save();track();
    UI.qrDone={t:'C’est noté, '+esc(nom.split(' ')[0])+' !',m:m&&m.tarif>0?`Passez à la caisse pour payer la ${esc(motif.toLowerCase())} (${usd(m.tarif)}). Vos informations y sont déjà.`:'Asseyez-vous, l’accueil va valider votre présence.'};render()},
  arrivee(f){
    let p;
    if(UI.newPatient){const nn=readName('np');if(!nn.prenom||!nn.nomFam){toast('Écrivez au moins le prénom et le nom.');$('#np-prenom').focus();return}
      p=newPatient(nn.nom,UI.site,{...nn,...(UI.sigFill?{naissance:UI.sigFill.naissance,tel:UI.sigFill.tel}:{})});
    }else{const nm=$('#a-patient').value.trim();p=S.patients.find(x=>x.site===UI.site&&norm(x.nom)===norm(nm));if(!p){toast(nm?'Patient introuvable. Choisissez « Ajouter comme nouveau patient ».':'Cherchez le patient ou choisissez « Nouveau patient ».');$('#a-patient').focus();return}}
    const motif=$('#a-motif').value.trim();if(!motif){toast('Indiquez le motif de la visite.');return}
    addToList('motifs',motif);
    const tarif=+$('#a-tarif').value||0;const m=S.listes.motifs.find(x=>norm(x.nom)===norm(motif));if(m&&m.tarif==null){m.tarif=tarif;toast(`Tarif de « ${esc(m.nom)} » fixé à ${usd(tarif)} pour les prochaines fois.`,'evo')}
    const plainte=$('#a-plainte').value.trim()||'Non précisé';if(plainte!=='Non précisé')addToList('plaintes',plainte);
    const v=enFile(p,m?m.nom:motif,tarif,plainte,tarif>0?readPay('a'):null);
    if(UI.sigFill){S.signalements=S.signalements.filter(x=>x.id!==UI.sigFill.id);UI.sigFill=null}
    save();track();UI.newPatient=false;render();receipt(v,'ticket');
  },
  constantes(f){
    const v=S.visites.find(x=>x.id===UI.nurseOpen);const g=id=>$('#'+id).value;
    v.constantes={taille:+g('n-taille')||null,poids:+g('n-poids')||null,tas:+g('n-tas')||null,tad:+g('n-tad')||null,pouls:+g('n-pouls')||null,temp:g('n-temp')||null,spo2:+g('n-spo2')||null};
    const nv=g('n-naiss');const pp=P(v.patientId);if(nv)pp.naissance=nv;if(g('n-sexe'))pp.sexe=g('n-sexe');if(g('n-tel').trim())pp.tel=g('n-tel').trim();
    const ag=g('n-agent').trim();if(ag)addToList('agents',ag);v.agent=ag;v.obs=g('n-obs').trim();v.statut='medecin';UI.nurseOpen=null;save();track();render();
    toast(`Fiche de ${esc(P(v.patientId).nom)} créée et envoyée au médecin.`);
  },
  consult(f){
    const v=S.visites.find(x=>x.id===UI.docOpen);const diag=$('#d-diag').value.trim();if(!diag){toast('Indiquez le diagnostic.');$('#d-diag').focus();return}
    addToList('diagnostics',diag);v.diagnostic=diag;v.examen=$('#d-exam').value.trim();
    v.traitement=$('input[name=trait]:checked').value==='oui';v.prescription=[];
    if(v.traitement)$$('#presc .presc-row').forEach(r=>{const k=r.dataset.row;const med=$('#m-'+k).value.trim();if(!med)return;const po=$('#po-'+k).value.trim();addToList('medicaments',med);if(po)addToList('posologies',po);const mo=S.listes.medicaments.find(x=>norm(x.nom)===norm(med));v.prescription.push({med:mo?mo.nom:med,poso:po||'Selon avis médical',qte:+$('#q-'+k).value||1})});
    v.controle=$('#d-ctrl').value;v.statut=v.prescription.length?'caisse':'termine';UI.docOpen=null;save();track();render();
    toast(v.prescription.length?`Ordonnance envoyée à la caisse. Contrôle le ${fmtShort(v.controle)}.`:`Fiche validée sans traitement. Contrôle le ${fmtShort(v.controle)}.`);
  },
  caisse(f){
    const v=S.visites.find(x=>x.id===UI.cashOpen);const ins=$$('.price-in');
    if(ins.some(i=>i.value==='')){toast('Saisissez le prix de chaque médicament.');ins.find(i=>i.value==='').focus();return}
    ins.forEach(i=>{const x=v.prescription[+i.dataset.i];const m=S.listes.medicaments.find(y=>norm(y.nom)===norm(x.med));const pr=+i.value;if(m&&m.prix!==pr){const was=m.prix;m.prix=pr;toast(was==null?`Prix de « ${esc(m.nom)} » enregistré : ${usd(pr)}. Il sera proposé automatiquement la prochaine fois.`:`Prix de « ${esc(m.nom)} » mis à jour : ${usd(pr)}.`,'evo')}});
    const tot=cashTotal();const pay=readPay('c');v.payeMed={...pay,montant:tot};S.paiements.push({date:TODAY,site:v.site,montant:tot,mode:pay.mode,objet:'Médicaments',visiteId:v.id});
    v.statut='remise';UI.cashOpen=null;save();track();render();receipt(v,'recu');
  },
  inscription(f){
    const nn=readName('i'),nom=nn.nom,tel=$('#i-tel').value.trim();if(!nn.prenom||!nn.nomFam||!tel){toast('Le prénom, le nom et le numéro WhatsApp sont nécessaires.');return}
    const site=$('#i-site').value;const n=S.patients.filter(x=>x.site===site).length+1;
    const p=newPatient(nom,site,{...nn,sexe:$('#i-sexe').value,naissance:$('#i-naiss').value||null,tel,email:$('#i-mail').value.trim()||null,compte:true});save();track();UI.session={type:'patient',id:p.id};saveUI();location.hash='menu';render();toast(`Compte créé. Votre numéro patient est ${p.dossier}.`);
  },
  site(f){
    const nom=$('#s-nom').value.trim();if(!nom){toast('Donnez un nom au site.');return}
    const prop=$('#s-prop').value.trim()||'Dr Soft';addToList('proprietaires',prop);
    let id=norm(nom).replace(/[^a-z0-9]/g,'').slice(0,8)||uid('s');while(siteOf(id))id+='1';
    S.sites.push({id,nom,ville:$('#s-ville').value.trim()||nom,responsable:$('#s-resp').value.trim()||'À désigner',proprietaire:prop,tel:$('#s-tel').value.trim(),statut:'attente',echeance:null,auto:true,depuis:TODAY});
    S.stats[id]={};S.pl30[id]={};save();track();render();toast(`Site « ${esc(nom)} » créé. Il s’active dès le premier paiement de ${usd(ABO)}.`);
  }
};
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();FORM[f.dataset.form](f)});
window.addEventListener('hashchange',()=>{if(UI.navKey&&window.__T&&window.__T[UI.navKey]?.go!==location.hash.slice(1))UI.navKey=null;render();window.scrollTo(0,0)});
render();
